# Runs on every push to `main`: checks the site still builds (a ✓ or ✗ next to
# your commit). It does NOT publish anything.
name: Check build
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pillow fonttools brotli
      - run: npm ci --prefix .fonts
      - name: Build the site
        # On failure, show build.py's message on the run page (not just "exit code 1").
        run: |
          python3 build.py > build.log 2>&1 || {
            cat build.log
            msg=$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=build.py failed::$msg"
            exit 1
          }
          cat build.log
