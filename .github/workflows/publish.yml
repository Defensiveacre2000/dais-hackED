# Publish the website.
# Pushing to `main` only BACKS UP your work — the live site does not change.
# To update the live site: GitHub → Actions → "Publish website" → Run workflow.
# This builds the site from `main` and puts the finished files on the `live`
# branch, which Netlify (or GitHub Pages) serves.
name: Publish website
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pillow fonttools brotli
      - run: npm ci --prefix .fonts
      - name: Build the site
        # On failure, show build.py's message on the run page (not just "exit code 1").
        run: |
          python3 build.py > build.log 2>&1 || {
            cat build.log
            msg=$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=build.py failed::$msg"
            exit 1
          }
          cat build.log
      # Netlify serves the `live` branch as-is: no build step there.
      - run: printf '[build]\n  publish = "."\n  command = ""\n' > dist/site/netlify.toml
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: live
          publish_dir: dist/site
          force_orphan: true
          commit_message: "Publish from ${{ github.sha }}"
